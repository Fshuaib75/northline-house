<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<meta name="robots" content="noindex,nofollow">
<title>Northline · My earnings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{--bg:#F4F0E8;--surface:#FBF8F2;--ink:#2E2C29;--ink-2:#4A443D;--muted:#6B6257;--line:#E2D9CA;--line-2:#D0C5B4;--olive:#5E5E45;--esp:#4A3426;--wa:#1F7A4D;
--display:"Newsreader",Georgia,serif;--ui:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.brand{font:600 11px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font:500 32px/1.1 var(--display);margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px;display:grid;gap:12px}
.due{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.due small{color:#CFC6B6;font-size:13px}.due b{font:500 44px/1 var(--display);font-variant-numeric:tabular-nums}
.due.zero{background:var(--surface);color:var(--ink);border-color:var(--line)}.due.zero small{color:var(--muted)}
.dots{display:flex;gap:8px}.dot{flex:1;height:10px;border-radius:2px;background:var(--line);transition:background .4s}
.dot.on{background:var(--olive)}.dot.new{background:var(--esp)}
.meter p{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;display:grid;gap:2px}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}.stat b{font:500 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
h2{font:500 20px/1.2 var(--display);margin:0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
li:first-child{border-top:0}li .d{color:var(--muted);font-size:12.5px;min-width:48px}li small{display:block;color:var(--muted);font-size:12.5px}
li .a{font-variant-numeric:tabular-nums;font-weight:600}
input[type=range]{width:100%;accent-color:var(--olive);height:36px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.big{font:500 28px/1 var(--display);font-variant-numeric:tabular-nums}
code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font:13px ui-monospace,Menlo,monospace;word-break:break-all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 14.5px var(--ui);text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);margin:0}.empty{text-align:center;padding:48px 8px;color:var(--ink-2)}
.rise{animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const SHOP="https://northlinehouse.shop/shop/", WA="2348168230733", PER=5;
const $=id=>document.getElementById(id), N=n=>"₦"+Math.round(n||0).toLocaleString("en-NG");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=s=>{try{return new Date(s+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}catch(e){return s||""}};
let D=null;
try{ const h=location.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/"); if(h) D=JSON.parse(decodeURIComponent(escape(atob(h)))); }catch(e){ D=null; }
const app=$("app");
if(!D||!D.n){
  app.innerHTML=`<div class="brand">Northline</div><div class="empty"><h1>Open your personal link</h1><p>This page shows your own sales and commission. Use the link we sent you on WhatsApp. If it stopped working, message us and we will send a new one.</p><a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent("Hello Northline, please send me my earnings link again.")}">Message Northline</a></div>`;
} else {
  const first=String(D.n).split(/\s+/)[0], link=SHOP+"?a="+encodeURIComponent(D.c);
  const avg=D.p?Math.round((D.e+D.pe)/D.p):(D.avg||4000);
  const dots=Array.from({length:PER},(_,i)=>`<span class="dot ${i<D.pr?"on":""}"></span>`).join("");
  const sales=(D.s||[]).map(s=>`<li><span class="d">${esc(fd(s[0]))}</span><span>${s[2]} item${s[2]==1?"":"s"}<small>${esc(s[1]||"")}</small></span><span class="a">${s[3]?N(s[3]):""}</span></li>`).join("");
  app.innerHTML=`
  <header class="rise"><div class="brand">Northline · Agent</div><h1>Hi ${esc(first)}</h1><p class="sub">Code <b>${esc(D.c)}</b> · updated ${esc(fd(D.d))}</p></header>
  <section class="card due rise ${D.ow?"":"zero"}" style="animation-delay:.05s"><small>Due to you now</small><b>${N(D.ow)}</b><small>${D.ow?"We will send this to you. Message us if you have not received it.":"Nothing due right now. Keep sharing your link."}</small></section>
  <section class="card meter rise" style="animation-delay:.1s"><div class="row"><h2>Next payout</h2><span class="sub">${D.pr} of ${PER} items</span></div><div class="dots" id="dots">${dots}</div>
    <p>${D.pr===0&&D.p>0?"A set of 5 just completed.":`${PER-D.pr} more paid item${PER-D.pr==1?"":"s"} to complete your next set.`} ${D.pe?`${N(D.pe)} is building up.`:""}</p></section>
  <section class="grid rise" style="animation-delay:.15s"><div class="stat"><span>Paid items sold</span><b>${D.p}</b></div><div class="stat"><span>Total earned</span><b>${N(D.e)}</b></div><div class="stat"><span>Paid out</span><b>${N(D.pd)}</b></div><div class="stat"><span>Building</span><b>${N(D.pe)}</b></div></section>
  <section class="card rise" style="animation-delay:.2s"><h2>What if I sell more?</h2>
    <div class="row"><span class="sub">Extra items this month</span><span class="big" id="exN">5</span></div>
    <input type="range" id="ex" min="0" max="30" value="5" aria-label="Extra items sold">
    <div class="row"><span class="sub">You would have earned</span><span class="big" id="exE"></span></div>
    <p class="note">Estimate using your average of ${N(avg)} per item. Your first paid item and each completed set of 5 are paid out. Real amounts depend on the items sold.</p></section>
  <section class="card rise" style="animation-delay:.25s"><h2>Recent sales</h2>${sales?`<ul>${sales}</ul>`:`<p class="sub">No sales yet. Your first paid item pays out straight away.</p>`}</section>
  <section class="card rise" style="animation-delay:.3s"><h2>Your customer link</h2><code id="lnk">${esc(link)}</code>
    <div class="acts"><button class="btn" id="cp" type="button">Copy link</button><a class="btn alt" href="https://wa.me/?text=${encodeURIComponent("Shop Northline House, delivered across Nigeria: "+link)}" target="_blank" rel="noopener">Share on WhatsApp</a></div>
    <p class="note">Orders made through this link are credited to you. Customers place the order online and we confirm size and delivery with them personally before they pay.</p></section>
  <a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent("Hello Northline, a question about my earnings. Code "+D.c)}">Question about my earnings</a>
  <p class="note">This page is a snapshot from ${esc(fd(D.d))}. Ask us for a fresh link to see newer numbers. Only people with your link can see it.</p>`;
  const up=()=>{ const x=+$("ex").value, tot=D.p+x, cyc=Math.floor(tot/PER), done=Math.min(tot,Math.max(cyc*PER,1)), proj=Math.round(avg*done);
    $("exN").textContent=x; $("exE").textContent=N(proj); };
  $("ex").addEventListener("input",up); up();
  $("cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); $("cp").textContent="Copied"; }catch(e){ const r=document.createRange(); r.selectNodeContents($("lnk")); getSelection().removeAllRanges(); getSelection().addRange(r); $("cp").textContent="Select and copy"; } setTimeout(()=>$("cp").textContent="Copy link",1800); };
}
</script>
</body>
</html>
