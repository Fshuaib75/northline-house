# Fetch supplier photos at full size for design work (hero slides, packaging). Runs when .github/fetch-urls.txt
# changes on a fetch-images branch (one link per line). Saves the photos to the
# `fetched-images` branch so they can be checked by eye before anything is published. Never touches the live site.
name: Fetch supplier photos

on:
  push:
    branches: ["claude/fetch-images", "codex/fetch-images"]
    paths: [".github/fetch-urls.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/fetch-urls.txt
          sparse-checkout-cone-mode: false
      - name: Download
        run: |
          URLS=$(grep -o 'https://[^ ]*' .github/fetch-urls.txt)
          mkdir out && cd out
          n=0
          for u in $URLS; do
            case "$u" in https://*) ;; *) echo "skipped (not https): $u"; continue;; esac
            n=$((n+1)); name=$(printf '%02d' $n)-$(basename "${u%%\?*}")
            if curl -fsSL --max-time 30 -A "Mozilla/5.0 (Northline design fetch)" -o "$name" "$u"; then echo "ok  $name  $u"; else echo "FAILED  $u"; fi
            echo "$name $u" >> sources.txt
          done
      - name: Save to the fetched-images branch
        working-directory: out
        run: |
          git init -q && git checkout -q -b fetched-images
          git config user.name "Northline photo fetch" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "Fetched supplier photos" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fetched-images
