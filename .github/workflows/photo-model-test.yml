# Northline photo model test. Scores every live catalogue photo with an open image model (OpenCLIP on CPU, free)
# and compares it with the keyword minimal rule. Read-only for the shop: it never edits products or the live site.
# Results (report.json, summary.md and contact sheets) are saved to the `photo-model-report` branch and
# summarised in a comment on the pull request. See tools/sourcing/vision.py.
name: Photo model test

on:
  pull_request:
    paths: [tools/sourcing/vision.py, tools/sourcing/keyword-check.mjs, .github/workflows/photo-model-test.yml]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: photo-model-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: photo-model-${{ runner.os }}-v1

      - name: Install the image model (CPU only)
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch pillow

      - name: Whole store catalogue (products.json plus the list built into the shop page)
        run: |
          node -e '
            const fs=require("fs"); const html=fs.readFileSync("site/shop/index.html","utf8");
            const m=html.match(/let ALL = (\[.*?\]);\n/s); const built=m?JSON.parse(m[1]):[];
            const all=new Map([...built,...JSON.parse(fs.readFileSync("site/products.json","utf8"))].map(i=>[i.ref,i]));
            fs.writeFileSync(process.argv[1],JSON.stringify([...all.values()]));
            console.log(`${all.size} styles in the store (${built.length} built into the page)`);' "$RUNNER_TEMP/store.json"

      - name: Keyword verdicts
        run: node code/tools/sourcing/keyword-check.mjs "$RUNNER_TEMP/store.json" "$RUNNER_TEMP/keywords.json"

      - name: Score every photo
        run: python code/tools/sourcing/vision.py --products "$RUNNER_TEMP/store.json" --keywords "$RUNNER_TEMP/keywords.json" --out "$RUNNER_TEMP/report" --images 4

      - name: Save results to the photo-model-report branch
        working-directory: ${{ runner.temp }}/report
        run: |
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          git init -q && git checkout -q -b photo-model-report
          git config user.name "Northline photo model test"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "Photo model test results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-model-report

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat "$RUNNER_TEMP/report/summary.md"; echo; echo "Contact sheets and full report: branch \`photo-model-report\`."; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} -F comment.md
