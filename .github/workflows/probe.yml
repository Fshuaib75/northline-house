# Development probe for the other-brands stock check: fetches sample pages and commits what it saw to this branch.
name: Stock probe (development)
on:
  push:
    branches: [probe-stock]
    paths: [tools/probe_urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/probe.py
      - run: |
          git config user.name "Northline probe"; git config user.email "actions@users.noreply.github.com"
          git add probe-out; git commit -m "probe results" || exit 0; git push origin HEAD:probe-stock
