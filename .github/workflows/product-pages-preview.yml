name: Product page preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/product-pages.mjs'
      - 'tools/tests/test_product_pages.mjs'
      - '.github/workflows/product-pages-preview.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: catalogue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test code/tools/tests/test_product_pages.mjs
      - run: node code/tools/product-pages.mjs catalogue "$RUNNER_TEMP/product-pages"
      - uses: actions/upload-artifact@v4
        with:
          name: product-pages-preview
          path: ${{ runner.temp }}/product-pages
          retention-days: 7
