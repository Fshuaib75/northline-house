# Scan allowlisted sources and seal all valid new findings for the book. No plaintext artifacts.
name: Sourcing scan

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Catalogue pages to read per brand (250 products each, 1-20)"
        default: "8"
        required: true

permissions:
  contents: write

concurrency:
  group: sourcing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          sparse-checkout: |
            products.json
            prices.json
            shop/index.html
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use the live catalogue and prices
        run: cp site/products.json site/prices.json code/ && cp site/shop/index.html code/shop/index.html

      - name: Read the brands' catalogues
        working-directory: code
        env:
          PAGES: ${{ inputs.pages }}
        run: python tools/sourcing/collect.py --output "$RUNNER_TEMP/sources" --pages "$PAGES"

      # Standing style/photo rules apply; no count caps or model-score exclusions.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: photo-model-${{ runner.os }}-v1
      - name: Install the photo model (CPU only)
        id: model
        continue-on-error: true
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch pillow
      - name: Photo check
        if: steps.model.outcome == 'success'
        continue-on-error: true
        working-directory: code
        run: |
          node tools/sourcing/engine.mjs pool "$RUNNER_TEMP/sources" "$RUNNER_TEMP/pool.json"
          python tools/sourcing/vision.py --candidates "$RUNNER_TEMP/pool.json" --out "$RUNNER_TEMP/photos.json"

      - name: Send all new findings to the book inbox
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/sourcing/queue.mjs "$RUNNER_TEMP/sources" "$RUNNER_TEMP/photos.json" > "$RUNNER_TEMP/summary.json"

      - name: Summary (counts only)
        run: |
          {
            echo "## Sourcing scan"
            echo 'Review findings in the book: To review. No candidate downloads or separate approval page.'
            echo 'Runs outside main are dry runs and do not send findings.'
            echo '```json'
            cat "$RUNNER_TEMP/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
