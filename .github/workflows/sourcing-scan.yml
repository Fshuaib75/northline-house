# Northline: on demand, scan the allowlisted suppliers for new products and build the sourcing review page.
# Press "Run workflow" under Actions > Sourcing scan. When it finishes, download "sourcing-review" from the
# run's Artifacts, unzip it and open review.html in a browser. Nothing is published or written to the shop:
# approved products still go through the owner's inbox.
name: Sourcing scan

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Catalogue pages to read per brand (250 products each, 1-20)"
        default: "8"
        required: true

      limit:
        description: "Maximum candidates in the review (1-500). At most 5 per brand; only minimal styles."
        default: "30"
        required: true

permissions:
  contents: read

concurrency:
  group: sourcing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          sparse-checkout: |
            products.json
            prices.json
            shop/index.html
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use the live catalogue and prices
        run: cp site/products.json site/prices.json code/ && cp site/shop/index.html code/shop/index.html

      - name: Read the brands' catalogues
        working-directory: code
        env:
          PAGES: ${{ inputs.pages }}
        run: python tools/sourcing/collect.py --output "$RUNNER_TEMP/sources" --pages "$PAGES"

      # Photo check (tools/sourcing/vision.py): an open image model looks at each candidate's photos, leaves out
      # loud ones (stones, sequins, prints, logos the title doesn't mention), flags borderline ones and puts the best
      # whole-item photo first. If any of this fails, the scan still finishes with the keyword rules alone.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: photo-model-${{ runner.os }}-v1
      - name: Install the photo model (CPU only)
        id: model
        continue-on-error: true
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch pillow
      - name: Photo check
        if: steps.model.outcome == 'success'
        continue-on-error: true
        working-directory: code
        run: |
          node tools/sourcing/engine.mjs pool "$RUNNER_TEMP/sources" "$RUNNER_TEMP/pool.json"
          python tools/sourcing/vision.py --candidates "$RUNNER_TEMP/pool.json" --out "$RUNNER_TEMP/photos.json"

      - name: Build the review page
        working-directory: code
        env:
          REVIEW_LIMIT: ${{ inputs.limit }}
        run: |
          node tools/sourcing/engine.mjs build "$RUNNER_TEMP/sources" "$RUNNER_TEMP/review" - "$REVIEW_LIMIT" "$RUNNER_TEMP/photos.json" | tee "$RUNNER_TEMP/summary.json"
          node -e 'const s=require(process.argv[1]);const x=s.excluded;console.log(`::notice title=Sourcing scan::${s.selected} selected from ${s.eligible} eligible. Left out: ${x.notMinimal} by keywords, ${x.loudPhoto} by photo, ${x.onlyPeoplePhotos} only had photos with people, ${x.known} already stocked. Photo check ${s.photo_check}. Brands: ${s.brands.join(", ")}`)' "$RUNNER_TEMP/summary.json"

      - name: Summary
        run: |
          {
            echo "## Sourcing scan"
            echo
            echo "Download **sourcing-review** below, unzip it and open \`review.html\`."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sourcing-review
          path: |
            ${{ runner.temp }}/review/review.html
            ${{ runner.temp }}/review/candidates.json
          retention-days: 14
